name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install protoc
        run: sudo apt-get install -y protobuf-compiler

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  sealed-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install protoc
        run: sudo apt-get install -y protobuf-compiler

      - name: Sealed Engine Restart Regression
        run: cargo test -p mv-engine test_sealed_restart_cycle_recovers_data_after_unseal_and_rebuild -- --nocapture

      - name: Sealed REST Restart Regression
        run: cargo test -p mv-server --test api_integration sealed_mode_lifecycle_survives_restart -- --nocapture --test-threads=1

      - name: Sealed Failpoint Auto-Reseal Regression
        run: |
          cargo test -p mv-server --test api_integration sealed_mode_unseal_failure_injected_at_migrate_reseals_vault -- --nocapture --test-threads=1
          cargo test -p mv-server --test api_integration sealed_mode_unseal_failure_injected_at_rebuild_reseals_vault -- --nocapture --test-threads=1

      - name: Transport Parity REST/gRPC
        run: cargo test -p mv-server --test transport_parity -- --nocapture --test-threads=1

  connectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            connectors/claude-code-mcp/package-lock.json
            connectors/openclaw-plugin/package-lock.json

      - name: Claude MCP Typecheck
        working-directory: connectors/claude-code-mcp
        run: |
          npm ci
          npx tsc --noEmit

      - name: OpenClaw Plugin Install & Typecheck
        working-directory: connectors/openclaw-plugin
        run: |
          npm install --save-dev typescript@5.8.3 @types/node@20
          npx tsc --noEmit --skipLibCheck --esModuleInterop --moduleResolution bundler --module preserve --target ES2022 --allowImportingTsExtensions index.ts client.ts

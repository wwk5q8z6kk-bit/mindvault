name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  connectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            connectors/claude-code-mcp/package-lock.json
            connectors/openclaw-plugin/package-lock.json

      - name: Claude MCP Typecheck
        working-directory: connectors/claude-code-mcp
        run: |
          npm ci
          npx tsc --noEmit

      - name: OpenClaw Plugin Syntax Check
        working-directory: connectors/openclaw-plugin
        run: |
          node --check index.ts
          node --check client.ts

[server]
bind_host = "127.0.0.1"
rest_port = 9470
grpc_port = 50051
socket_path = "~/.mindvault/mindvault.sock"
cors_allowed_origins = []

[storage]
data_dir = "~/.mindvault/data"
sqlite_path = "~/.mindvault/data/mindvault.sqlite"
lancedb_path = "~/.mindvault/data/lancedb"
tantivy_path = "~/.mindvault/data/tantivy"
blobs_path = "~/.mindvault/data/blobs"

[profile]
display_name = "MindVault Owner"
primary_email = ""
timezone = "UTC"
signature = ""

[email]
enabled = false
namespace = "default"
poll_interval_secs = 120
max_fetch = 20
max_attachment_bytes = 5242880
mark_seen = false
imap_host = ""
imap_port = 993
imap_username = ""
imap_folder = "INBOX"
imap_starttls = true
smtp_host = ""
smtp_port = 587
smtp_username = ""
smtp_from = ""
smtp_starttls = true
# Passwords should be set via secrets:
# mindvault secret set MINDVAULT_EMAIL_IMAP_PASSWORD
# mindvault secret set MINDVAULT_EMAIL_SMTP_PASSWORD

[google_calendar]
enabled = false
namespace = "default"
calendar_id = "primary"
sync_interval_secs = 900
lookback_days = 30
lookahead_days = 90
max_results = 250
import_events = true
export_events = false
# OAuth2 credentials should be provided via environment variables:
# - MINDVAULT_GOOGLE_CALENDAR_CLIENT_ID
# - MINDVAULT_GOOGLE_CALENDAR_CLIENT_SECRET
# - MINDVAULT_GOOGLE_CALENDAR_REFRESH_TOKEN
# Optionally override:
# - MINDVAULT_GOOGLE_CALENDAR_ENABLED
# - MINDVAULT_GOOGLE_CALENDAR_NAMESPACE
# - MINDVAULT_GOOGLE_CALENDAR_CALENDAR_ID
# - MINDVAULT_GOOGLE_CALENDAR_SYNC_INTERVAL_SECS
# - MINDVAULT_GOOGLE_CALENDAR_LOOKBACK_DAYS
# - MINDVAULT_GOOGLE_CALENDAR_LOOKAHEAD_DAYS
# - MINDVAULT_GOOGLE_CALENDAR_MAX_RESULTS
# - MINDVAULT_GOOGLE_CALENDAR_IMPORT_EVENTS
# - MINDVAULT_GOOGLE_CALENDAR_EXPORT_EVENTS

[embedding]
provider = "local_fastembed"
model = "bge-small-en-v1.5"
dimensions = 384
# local provider options:
# - provider = "local_fastembed"
# - model = "bge-small-en-v1.5" (or "all-minilm-l6-v2")
# - build with cargo feature: --features local-embeddings
#
# openai provider options:
# - provider = "openai"
# - model = "text-embedding-3-small"
# - dimensions = 1536
# - api_key loaded from OPENAI_API_KEY env var

[llm]
enabled = false
auto_detect = true
base_url = "http://localhost:11434/v1"
model = "llama3.2"
max_tokens = 512
temperature = 0.3
timeout_secs = 30
# Opt in before a discovered API key may enable a remote cloud provider.
# Keys resolve through the credential store, which falls back to environment
# variables, so leaving this false keeps an ambient OPENAI_API_KEY from sending
# vault content off-device. Local providers (llama.cpp, auto-detected Ollama)
# are unaffected. Override: MINDVAULT_LLM_ALLOW_CLOUD_FALLBACK=true
allow_cloud_fallback = false

[ai_sidecar]
enabled = false
base_url = "http://127.0.0.1:8100"
timeout_secs = 30

[watcher]
enabled = true
interval_secs = 300
lookback_hours = 24
max_nodes_per_cycle = 50
expiry_days = 7

[search]
default_limit = 10
default_strategy = "hybrid"
min_score = 0.1
vector_weight = 0.6
fulltext_weight = 0.4

[graph]
default_traversal_depth = 2
graph_boost_factor = 0.15

[ai]
auto_tagging_enabled = false
auto_tagging_max_generated_tags = 6
auto_tagging_max_total_tags = 12
auto_tagging_similarity_seed_limit = 8
auto_tagging_min_token_length = 4
# Env overrides:
# - MINDVAULT_AI_AUTO_TAGGING_ENABLED
# - MINDVAULT_AI_AUTO_TAGGING_MAX_GENERATED_TAGS
# - MINDVAULT_AI_AUTO_TAGGING_MAX_TOTAL_TAGS
# - MINDVAULT_AI_AUTO_TAGGING_SIMILARITY_SEED_LIMIT
# - MINDVAULT_AI_AUTO_TAGGING_MIN_TOKEN_LENGTH

[linking]
auto_backlinks_enabled = true
auto_backlinks_scan_limit = 5000
auto_backlinks_max_targets = 64
# Env overrides:
# - MINDVAULT_LINKING_AUTO_BACKLINKS_ENABLED
# - MINDVAULT_LINKING_AUTO_BACKLINKS_SCAN_LIMIT
# - MINDVAULT_LINKING_AUTO_BACKLINKS_MAX_TARGETS

[daily_notes]
enabled = true
midnight_scheduler_enabled = true
namespace = "journal"
title_template = "Daily Note {{date}}"
content_template = """
## Top Priorities
- [ ] 

## Schedule
- Morning:
- Afternoon:
- Evening:

## Notes

## Wins
- 

## Blockers
- 

## Follow-up
- 
"""
default_importance = 0.6
# Env overrides:
# - MINDVAULT_DAILY_NOTES_ENABLED
# - MINDVAULT_DAILY_NOTES_MIDNIGHT_SCHEDULER_ENABLED
# - MINDVAULT_DAILY_NOTES_NAMESPACE
# - MINDVAULT_DAILY_NOTES_TITLE_TEMPLATE
# - MINDVAULT_DAILY_NOTES_CONTENT_TEMPLATE
# - MINDVAULT_DAILY_NOTES_DEFAULT_IMPORTANCE

[recurrence]
enabled = true
scheduler_interval_secs = 300
max_instances_per_template = 8
# Env overrides:
# - MINDVAULT_RECURRENCE_ENABLED
# - MINDVAULT_RECURRENCE_SCHEDULER_INTERVAL_SECS
# - MINDVAULT_RECURRENCE_MAX_INSTANCES_PER_TEMPLATE

[encryption]
enabled = false
argon2_memory_kib = 65536
argon2_iterations = 3
argon2_parallelism = 4
# Env overrides:
# - MINDVAULT_ENCRYPTION_ENABLED
# - MINDVAULT_ENCRYPTION_ARGON2_MEMORY_KIB
# - MINDVAULT_ENCRYPTION_ARGON2_ITERATIONS
# - MINDVAULT_ENCRYPTION_ARGON2_PARALLELISM

[auth]
enabled = false
# Runtime auth configuration is environment-driven:
# - MINDVAULT_AUTH_TOKEN (shared bearer token)
# - MINDVAULT_AUTH_ROLE (admin|write|read, optional)
# - MINDVAULT_AUTH_NAMESPACE (namespace scope for shared token, optional)
# - MINDVAULT_JWT_SECRET (HS256 JWT secret, optional)
# - MINDVAULT_ALLOW_INSECURE_BIND (set true to allow non-local bind without auth)
# - MINDVAULT_RATE_LIMIT_REQUESTS (requests per window, default 120; 0 disables)
# - MINDVAULT_RATE_LIMIT_WINDOW_SECS (window size, default 60)
# - MINDVAULT_AI_RATE_LIMIT_REQUESTS (chat/assist per subject, default 60; 0 disables)
# - MINDVAULT_AI_RATE_LIMIT_WINDOW_SECS (AI window size, default 60)
# - MINDVAULT_NAMESPACE_NODE_QUOTA (max nodes per namespace, optional)

[logging]
level = "info"
format = "pretty"
log_dir = "~/.mindvault/logs"

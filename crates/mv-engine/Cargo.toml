[package]
name = "mv-engine"
version.workspace = true
edition.workspace = true

[features]
default = ["local-embeddings"]
local-embeddings = ["mv-storage/local-embeddings"]
image-embeddings = ["dep:fastembed"]
wip = []

[dependencies]
mv-core = { workspace = true }
mv-storage = { workspace = true }
mv-index = { workspace = true }
mv-graph = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
rusqlite = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true }
aes-gcm = { workspace = true }
argon2 = { workspace = true }
zeroize = { workspace = true }
reqwest = { workspace = true }
libc = { workspace = true }
regex = "1"
once_cell = "1"
walkdir = "2"
fastembed = { version = "5.8", optional = true, default-features = false, features = ["hf-hub-native-tls", "ort-load-dynamic", "image-models"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
core-foundation = "0.10"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }

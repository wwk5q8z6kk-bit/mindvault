<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MindVault Clipper Options</title>
  <style>
    :root {
      --bg: #f6f8ff;
      --panel: #ffffff;
      --border: #d5dcf0;
      --text: #0f1d42;
      --muted: #4e5f8b;
      --accent: #0ea5e9;
    }
    body {
      margin: 0;
      background: linear-gradient(140deg, #eef4ff, #f9fbff);
      color: var(--text);
      font: 14px/1.45 "IBM Plex Sans", "Segoe UI", sans-serif;
    }
    .wrap {
      max-width: 720px;
      margin: 24px auto;
      padding: 18px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 12px 28px rgba(23, 44, 88, 0.08);
    }
    h1 { margin-top: 0; font-size: 20px; }
    p { color: var(--muted); }
    .row { display: grid; gap: 8px; margin-bottom: 12px; }
    input {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font: inherit;
    }
    .checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
    }
    .checkbox input {
      width: auto;
      padding: 0;
    }
    button {
      border: 0;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--accent), #22d3ee);
      color: #082233;
      font-weight: 700;
      padding: 10px 14px;
      cursor: pointer;
    }
    .status { margin-top: 10px; color: var(--muted); min-height: 20px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>MindVault Clipper Settings</h1>
    <p>Configure the local MindVault API and fallback app URL used by the extension.</p>
    <div class="row">
      <label for="apiBaseUrl">MindVault API base URL</label>
      <input id="apiBaseUrl" placeholder="http://127.0.0.1:9470" />
    </div>
    <div class="row">
      <label for="appBaseUrl">MindVault app base URL (fallback handoff)</label>
      <input id="appBaseUrl" placeholder="http://localhost:5173" />
    </div>
    <div class="row">
      <label for="namespace">Default namespace</label>
      <input id="namespace" placeholder="default" />
    </div>
    <div class="row">
      <label for="authToken">Auth token (optional, Bearer token)</label>
      <input id="authToken" placeholder="token" type="password" />
    </div>
    <div class="row checkbox">
      <input id="enrichBeforeSave" type="checkbox" checked />
      <label for="enrichBeforeSave">Enrich clip metadata before save</label>
    </div>
    <button id="save">Save settings</button>
    <div class="status" id="status"></div>
  </div>
  <script src="options.js" type="module"></script>
</body>
</html>

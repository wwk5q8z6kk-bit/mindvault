[package]
name = "mindvault-desktop"
version = "0.1.0"
description = "MindVault desktop application — local-first knowledge memory"
authors = ["MindVault Contributors"]
license = "MIT"
repository = "https://github.com/nicholasgasior/mindvault"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.0" }
tauri-plugin-log = "2"

<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!--
			No remote font stylesheet. A sovereign, local-first vault must not
			contact a third party to render its own interface:

			- Offline, the request never settles, so the `load` event never fires
			  and the page hangs. Constitutional law 12 requires core workflows to
			  function locally.
			- Online, it announced every page view to a font CDN, which is a
			  privacy leak the rest of this product is built to prevent.

			It was also buying nothing. Plus Jakarta Sans is referenced nowhere in
			the stylesheets; JetBrains Mono is used for code but already falls back
			through SFMono-Regular / Consolas / Menlo / monospace; and `Outfit` —
			the first family in the body stack in app.css — was never fetched at
			all. Self-host the files under src/lib/assets/ if a specific face is
			ever genuinely required.
		-->
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

[project]
name = "mindvault-ai"
version = "0.1.0"
description = "MindVault Python AI microservice — local embeddings, RAG, NLP pipelines"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sentence-transformers>=3.3",
    "torch>=2.2.2,<2.5; platform_machine == 'x86_64' and sys_platform == 'darwin'",
    "torch>=2.5; platform_machine != 'x86_64' or sys_platform != 'darwin'",
    "onnxruntime>=1.17,<=1.23.2; platform_machine == 'x86_64' and sys_platform == 'darwin'",
    "onnxruntime>=1.17; platform_machine != 'x86_64' or sys_platform != 'darwin'",
    "spacy>=3.8",
    "sumy>=0.11",
    "httpx>=0.28",
    "numpy>=2.1",
    "tokenizers>=0.21",
    "prometheus-client>=0.21",
    "structlog>=24.4",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
finetune = ["peft>=0.14", "datasets>=3.2", "accelerate>=1.2"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "pytest-cov>=6.0", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mindvault_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
